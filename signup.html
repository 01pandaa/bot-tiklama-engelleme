<!doctype html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClickShield — Hesap Oluştur</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-body"><div class="auth-card"><div class="auth-logo"><div class="logo-mark">C</div><div><strong>ClickShield</strong><span>Bot Tıklama Koruması</span></div></div><h1>Müşteri hesabı oluştur</h1><p class="auth-sub">Dakikalar içinde reklam trafiğini izlemeye başla.</p><form id="signupForm"><label>Ad Soyad<input id="fullName" type="text" required autocomplete="name" placeholder="Ad Soyad"></label><label>E-posta<input id="email" type="email" required autocomplete="email" placeholder="ornek@firma.com"></label><label>Şifre<input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="En az 8 karakter"></label><button class="primary wide" type="submit">Hesap Oluştur</button></form><div id="message" class="auth-message"></div><p class="auth-switch">Zaten hesabın var mı? <a href="login.html">Giriş yap</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></body></html>
